<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Details Share</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="w-full py-8 px-4 text-center">
        <div class="inline-flex items-center justify-center p-3 bg-indigo-50 rounded-2xl mb-3 text-indigo-600 shadow-sm">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">Банкны мэдээлэл</h1>
        <p class="text-sm text-slate-500 mt-1">Хуулах товч дээр дарна уу!</p>
    </header>

    <main class="w-full max-w-md mx-auto px-4 mb-auto">
        <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6 sm:p-8 space-y-5">
            
            <!-- Account Holder Name -->
            <div class="group relative bg-slate-50 hover:bg-indigo-50/40 border border-slate-200/80 rounded-2xl p-4 transition-all duration-200 cursor-pointer" onclick="copyText('Чулуунбат', this, 'name-status')">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Нэр</span>
                        <p id="acc-name" class="text-base sm:text-lg font-semibold text-slate-800 mt-0.5">Чулуунбат</p>
                    </div>
                    <button class="inline-flex items-center space-x-1 px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-600 group-hover:border-indigo-200 group-hover:text-indigo-600 shadow-xs transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="name-status">Хуулах</span>
                    </button>
                </div>
            </div>

            <!-- Bank Name -->
            <div class="group relative bg-slate-50 hover:bg-indigo-50/40 border border-slate-200/80 rounded-2xl p-4 transition-all duration-200 cursor-pointer" onclick="copyText('Хаан банк', this, 'bank-status')">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Банк</span>
                        <p id="acc-bank" class="text-base sm:text-lg font-semibold text-slate-800 mt-0.5">Хаан банк</p>
                    </div>
                    <button class="inline-flex items-center space-x-1 px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-600 group-hover:border-indigo-200 group-hover:text-indigo-600 shadow-xs transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="bank-status">Хуулах</span>
                    </button>
                </div>
            </div>

            <!-- IBAN -->
            <div class="group relative bg-slate-50 hover:bg-indigo-50/40 border border-slate-200/80 rounded-2xl p-4 transition-all duration-200 cursor-pointer" onclick="copyText('74000500', this, 'iban-status')">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">IBAN</span>
                        <p id="acc-iban" class="text-sm sm:text-base font-mono font-bold text-slate-800 mt-0.5 tracking-tight break-all">74000500</p>
                    </div>
                    <button class="shrink-0 ml-3 inline-flex items-center space-x-1 px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-600 group-hover:border-indigo-200 group-hover:text-indigo-600 shadow-xs transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="iban-status">Хуулах</span>
                    </button>
                </div>
            </div>

            <!-- BIC / SWIFT -->
            <div class="group relative bg-slate-50 hover:bg-indigo-50/40 border border-slate-200/80 rounded-2xl p-4 transition-all duration-200 cursor-pointer" onclick="copyText('5021361105', this, 'bic-status')">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-semibold tracking-wider text-slate-400 uppercase">Дансны дугаар</span>
                        <p id="acc-bic" class="text-base sm:text-lg font-mono font-bold text-slate-800 mt-0.5">5021361105</p>
                    </div>
                    <button class="inline-flex items-center space-x-1 px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-600 group-hover:border-indigo-200 group-hover:text-indigo-600 shadow-xs transition-colors">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span id="bic-status">Хуулах</span>
                    </button>
                </div>
            </div>

            <!-- <div class="pt-2">
                <button onclick="copyAllDetails()" class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/25 transition-all duration-200 flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                    <span id="copy-all-text">Бүгдийг нь хуулах</span>
                </button>
            </div> -->

        </div>
    </main>

    <footer class="w-full py-6 text-center text-xs text-slate-400">
        <p>Secure & Instant Bank Information Sharing</p>
    </footer>

    <script>
        // Fallback or explicit copy handler compatible with iframe restrictions
        function copyText(textToCopy, element, statusId) {
            // Prevent event bubbling if clicked inside card structure
            if (event) event.stopPropagation();

            const targetSpan = document.getElementById(statusId);
            const originalText = targetSpan.innerText;

            // Use legacy execCommand fallback for robust iframe support
            const textarea = document.createElement("textarea");
            textarea.value = textToCopy;
            textarea.style.position = "fixed";  // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            try {
                document.execCommand('copy');
                showSuccess(targetSpan, originalText);
            } catch (err) {
                console.error('Failed to copy text', err);
            }
            document.body.removeChild(textarea);
        }

        function copyAllDetails() {
            const name = document.getElementById('acc-name').innerText;
            const bank = document.getElementById('acc-bank').innerText;
            const iban = document.getElementById('acc-iban').innerText;
            const bic = document.getElementById('acc-bic').innerText;

            const formattedText = 
`Account Holder: ${name}
Bank Name: ${bank}
IBAN: ${iban}
BIC/SWIFT: ${bic}`;

            const textarea = document.createElement("textarea");
            textarea.value = formattedText;
            textarea.style.position = "fixed";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            const copyAllBtnText = document.getElementById('copy-all-text');
            try {
                document.execCommand('copy');
                copyAllBtnText.innerText = 'Copied All Details Successfully!';
                setTimeout(() => {
                    copyAllBtnText.innerText = 'Copy All Details';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy all', err);
            }
            document.body.removeChild(textarea);
        }

        function showSuccess(spanElement, originalText) {
            spanElement.innerText = 'Copied!';
            spanElement.classList.add('text-indigo-600', 'font-bold');
            
            setTimeout(() => {
                spanElement.innerText = originalText;
                spanElement.classList.remove('text-indigo-600', 'font-bold');
            }, 1800);
        }
    </script>
</body>
</html>
